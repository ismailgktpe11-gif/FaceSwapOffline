name: Build FaceSwap Offline v0.2.5

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "source/v025.part*"
      - ".github/workflows/build-v025.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: bash
        run: |
          cat source/v025.part00a               source/v025.part00b               source/v025.part00c               source/v025.part00d               source/v025.part01               source/v025.part02               source/v025.part03a               source/v025.part03b               source/v025.part03c               source/v025.part03d               source/v025.part04 > /tmp/v025.b64
          base64 --decode /tmp/v025.b64 > /tmp/FaceSwapOffline-v0.2.5.zip
          echo "d688ddf14609d2f6a2d9ed554508031ef73e52726f7ef1c84ba3fadd3b471c68  /tmp/FaceSwapOffline-v0.2.5.zip" | sha256sum -c -
          unzip -q /tmp/FaceSwapOffline-v0.2.5.zip -d /tmp/faceswap-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build APK
        working-directory: /tmp/faceswap-src/FaceSwapOfflineV025
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          test -f /tmp/faceswap-src/FaceSwapOfflineV025/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/faceswap-src/FaceSwapOfflineV025/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FaceSwapOffline-v0.2.5.apk"
          sha256sum "$GITHUB_WORKSPACE/FaceSwapOffline-v0.2.5.apk" | tee "$GITHUB_WORKSPACE/FaceSwapOffline-v0.2.5.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapOffline-v0.2.5-APK
          path: |
            FaceSwapOffline-v0.2.5.apk
            FaceSwapOffline-v0.2.5.sha256
          if-no-files-found: error
          retention-days: 30
